governance:
  canonicality_order:
    - exam-blueprint
    - google-skills
    - architecture-center
    - github-terraform
    - codelab
    - github-colab
    - coursera
    - coursera-third-party
  placement_rule: "Place each resource at its primary certification and exam section; use shared only for genuinely cross-cutting resources."
  verification_rule: "Before execution or download, verify the URL, title, source owner, and last-modified or publication signal when available."
  link_failure_rule: "If a URL is unavailable or ambiguous, set resource_status to LINK_REVIEW_REQUIRED and do not invent a replacement URL."
  execution_rule: "Track each resource from NOT_STARTED to IN_PROGRESS, COMPLETED, and EVIDENCE_CAPTURED."
